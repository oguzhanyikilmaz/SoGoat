  // pointer velocity (smoothed) and presence fade
  if (ptr.px > -1e3 && ptr.on) { ptr.vx += ((ptr.x - ptr.px) - ptr.vx) * .35; ptr.vy += ((ptr.y - ptr.py) - ptr.vy) * .35; }
  else { ptr.vx *= .9; ptr.vy *= .9; }
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.amt += ((ptr.on ? 1 : 0) - ptr.amt) * .08 * dt;
  const speed = Math.min(40, Math.hypot(ptr.vx, ptr.vy));
  const RAD = Math.max(80, H * .14) * (1 + speed / 70);

  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    const tx = offX + p.gx * cell, ty = offY + p.gy * cell;
    const k = (t - p.delay) / p.dur;
    if (k <= 0) continue;
    const base = p.type === 0 ? cell * (0.14 + 0.86 * p.l) : cell * (0.62 + 0.62 * p.l);
    const baseA = p.type === 0 ? 0.55 + 0.45 * p.l : 0.45 + 0.55 * p.l;

    if (k < 1) {
      const s = streams[p.st];
      const e = flightEase(k);
      const ox = CX + Math.cos(s.a) * R + p.lat * 60 * Math.sin(s.a), oy = CY + Math.sin(s.a) * R - p.lat * 60 * Math.cos(s.a);
      const dx = tx - ox, dy = ty - oy;
      const qx = (ox + tx) / 2 - dy * s.bend * .35, qy = (oy + ty) / 2 + dx * s.bend * .35;
      const u = 1 - e;
      const x = u * u * ox + 2 * u * e * qx + e * e * tx, y = u * u * oy + 2 * u * e * qy + e * e * ty;
      // travel as a binary glyph, then melt into the final mark over the last stretch
      const m = smooth(Math.max(0, (k - .55) / .45));
      const fly = cell * 1.15;
      const flyA = (.22 + .4 * Math.min(1, k * 4)) * (1 - m);
      const flick = (Math.floor(t * 10 + p.s) & 1) + 1;
      if (flyA > .01) { ctx.globalAlpha = flyA; ctx.drawImage(sprites[m > .3 ? p.alt : flick], x - fly / 2, y - fly / 2, fly, fly); }
      if (m > 0) { const sz = fly + (base - fly) * m; ctx.globalAlpha = baseA * m; ctx.drawImage(sprites[p.type], x - sz / 2, y - sz / 2, sz, sz); }
      continue;
    }

    // ---- settled: fluid, magnetic hover ----
    const px = tx + p.ox, py = ty + p.oy;
    const dx = px - ptr.x, dy = py - ptr.y, d = Math.hypot(dx, dy);
    let f = 0;
    if (ptr.amt > .01 && d < RAD) {
      f = 1 - d / RAD; f = f * f * (3 - 2 * f) * ptr.amt;
      const nx = dx / (d || 1), ny = dy / (d || 1);
      // soft outward push, a slow swirl around the cursor, and a wake that follows its motion
      p.vx += (nx * .8 - ny * .5) * f * dt + ptr.vx * .045 * f * dt;
      p.vy += (ny * .8 + nx * .5) * f * dt + ptr.vy * .045 * f * dt;
    }
    p.h += (f - p.h) * .12 * dt;
    p.vx += -p.ox * .022 * dt; p.vy += -p.oy * .022 * dt;
    const damp = Math.pow(.9, dt); p.vx *= damp; p.vy *= damp;
    p.ox += p.vx * dt; p.oy += p.vy * dt;

    const x = tx + p.ox, y = ty + p.oy;
    const disp = Math.min(1, Math.hypot(p.ox, p.oy) / (cell * 6));
    const lens = Math.max(p.h, disp * .8);
    const sz = base * (1 + .55 * lens);
    // near the cursor, dots reveal the bit they carry
    if (p.type === 0 && lens > .02 && p.l > .12) {
      const g = smooth(Math.min(1, lens * 1.6));
      ctx.globalAlpha = baseA * (1 - g); ctx.drawImage(sprites[0], x - sz / 2, y - sz / 2, sz, sz);
      const gs = Math.max(sz, cell * (0.7 + .6 * p.l)) * (1 + .2 * g);
      ctx.globalAlpha = (0.5 + .5 * p.l) * g; ctx.drawImage(sprites[p.alt], x - gs / 2, y - gs / 2, gs, gs);
    } else {
      ctx.globalAlpha = baseA; ctx.drawImage(sprites[p.type], x - sz / 2, y - sz / 2, sz, sz);
    }
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
